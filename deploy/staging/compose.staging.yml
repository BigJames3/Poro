# Staging (PORO-010): every service runs the image CI published for one
# commit, never a local build. Used by deploy/deploy.sh:
#
#   docker compose -f docker-compose.yml -f deploy/staging/compose.staging.yml ...
#
# PORO_IMAGE_REGISTRY (ghcr.io/<owner>) and PORO_IMAGE_TAG (sha-<commit>) are
# set by the deploy script; secrets interpolated by docker-compose.yml come
# from --env-file .env.staging on the host (never committed).
#
# APP_ENV=staging makes every service refuse the shortcuts of local
# development (Postgres without TLS, log SMS/SMTP, http public endpoints).
# docker-compose.yml still points at the local Postgres, SeaweedFS and
# Redpanda: until the hosting provider is chosen, a staging layer naming the
# managed endpoints is missing, and services refuse to start rather than run
# with development settings. deploy/deploy.sh then rolls back.
services:
  auth:
    image: ${PORO_IMAGE_REGISTRY:?set by deploy/deploy.sh}/poro-auth:${PORO_IMAGE_TAG:?set by deploy/deploy.sh}
    pull_policy: always
    build: !reset null
    environment:
      APP_ENV: staging
  feed:
    image: ${PORO_IMAGE_REGISTRY:?set by deploy/deploy.sh}/poro-feed:${PORO_IMAGE_TAG:?set by deploy/deploy.sh}
    pull_policy: always
