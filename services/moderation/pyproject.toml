[project]
name = "poro-moderation"
version = "1.0.0"
description = "PORO moderation service: reports, rule-based filter and moderator queue"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "sqlalchemy[asyncio]==2.1.4",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "aiokafka==0.14.0",
  "pyjwt[crypto]==2.15.1",
  "redis==8.1.0",
  "prometheus-client==0.26.0",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "testcontainers[postgres,kafka]==4.15.0",
  "fakeredis==2.39.0",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "types-pyyaml==6.0.12.20260906",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moderation"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N", "BLE", "DTZ", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["moderation"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["moderation"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
