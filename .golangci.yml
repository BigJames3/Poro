# Shared golangci-lint configuration for the Go services (v2 format).
# Run from a module directory: golangci-lint run ./...
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    errcheck:
      # Deferred Rollback after Commit and best-effort Close are intentional.
      exclude-functions:
        - (github.com/jackc/pgx/v5.Tx).Rollback
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
