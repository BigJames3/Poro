# Static card behind nginx (Dockerfile). TLS is terminated upstream (Traefik,
# load balancer, CDN); HSTS is still sent so browsers keep to https.
# The security headers (security-headers.conf) must stay equal to
# src/lib/headers.js: a unit test compares them.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # nginx drops inherited add_header lines in any block that sets its
    # own: the headers are repeated through this include in every location.
    include /etc/nginx/snippets/security-headers.conf;

    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        application/manifest+json webmanifest;
        text/vcard vcf;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        text/plain txt;
    }
    default_type application/octet-stream;
    charset_types text/css text/javascript application/json application/manifest+json text/vcard text/plain;

    gzip on;
    gzip_types text/css text/javascript application/json application/manifest+json image/svg+xml text/vcard;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Not part of the site: host-specific header file.
    location = /_headers {
        return 404;
    }

    error_page 404 /404.html;
}
