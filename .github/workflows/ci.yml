name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      shared-go: ${{ steps.filter.outputs.shared-go }}
      auth: ${{ steps.filter.outputs.auth }}
      relay: ${{ steps.filter.outputs.relay }}
      user: ${{ steps.filter.outputs.user }}
      video: ${{ steps.filter.outputs.video }}
      social: ${{ steps.filter.outputs.social }}
      feed: ${{ steps.filter.outputs.feed }}
      notification: ${{ steps.filter.outputs.notification }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared-go:
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
            auth:
              - 'services/auth/**'
              - 'packages/shared-go/**'
              - '.github/workflows/ci.yml'
            relay:
              - 'services/outbox-relay/**'
              - 'packages/shared-go/**'
              - '.github/workflows/ci.yml'
            user:
              - 'services/user/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
            video:
              - 'services/video/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
            social:
              - 'services/social/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            feed:
              - 'services/feed/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            notification:
              - 'services/notification/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile-android/**'

  shared-go:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.shared-go == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/shared-go/go.mod
          cache-dependency-path: packages/shared-go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Tests
        run: go test ./... -count=1 -cover

  outbox-relay:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/outbox-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/outbox-relay/go.mod
          cache-dependency-path: |
            services/outbox-relay/go.sum
            packages/shared-go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Tests
        run: go test ./... -count=1 -cover
      - name: Docker build
        working-directory: .
        run: docker build -f services/outbox-relay/Dockerfile -t poro-outbox-relay:${{ github.sha }} .

  auth:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/auth/go.mod
          cache-dependency-path: |
            services/auth/go.sum
            packages/shared-go/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Unit and integration tests
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Docker build
        working-directory: .
        run: docker build -f services/auth/Dockerfile -t poro-auth:${{ github.sha }} .

  user:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.user == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user
    env:
      # prisma.config.ts refuses an unset URL; generate never connects and
      # the e2e tests start their own Postgres container.
      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/user/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:cov
      - name: Docker build
        run: docker build -t poro-user:${{ github.sha }} .

  notification:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.notification == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification
    env:
      # prisma.config.ts refuses an unset URL; generate never connects and
      # the e2e tests start their own Postgres container.
      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/notification/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:cov
      - name: Docker build
        run: docker build -t poro-notification:${{ github.sha }} .

  video:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.video == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/video/go.mod
          cache-dependency-path: |
            services/video/go.sum
            packages/shared-go/go.sum
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Tests
        run: go test ./... -count=1 -coverprofile=coverage.out
      - name: Docker build
        working-directory: .
        run: |
          docker build -f services/video/Dockerfile -t poro-video:${{ github.sha }} .
          docker build -f services/video/Dockerfile.worker -t poro-media-worker:${{ github.sha }} .

  social:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.social == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/social/go.mod
          cache-dependency-path: |
            services/social/go.sum
            packages/shared-go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: services/social
          args: --config ../../.golangci.yml
      - name: Unit and integration tests
        run: go test ./... -count=1 -race -coverpkg=./internal/... -coverprofile=coverage.out
      - name: Coverage at least 70%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 70) }'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Docker build
        working-directory: .
        run: docker build -f services/social/Dockerfile -t poro-social:${{ github.sha }} .

  feed:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.feed == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/feed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/feed/go.mod
          cache-dependency-path: |
            services/feed/go.sum
            packages/shared-go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: services/feed
          args: --config ../../.golangci.yml
      - name: Unit and integration tests
        run: go test ./... -count=1 -race -coverpkg=./internal/... -coverprofile=coverage.out
      - name: Coverage at least 70%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 70) }'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Docker build
        working-directory: .
        run: docker build -f services/feed/Dockerfile -t poro-feed:${{ github.sha }} .

  mobile-build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - run: echo "Build Android � configurer"
