      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Docker build
        working-directory: .
        run: docker build -f services/search/Dockerfile -t poro-search:${{ github.sha }} .
      - name: Trivy image scan (poro-search)
