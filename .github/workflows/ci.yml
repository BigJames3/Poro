      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/shop/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: npm audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:cov
      - name: Docker build
        run: docker build -t poro-shop:${{ github.sha }} .
      - name: Trivy image scan (poro-shop)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-shop:${{ github.sha }}

  order:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.order == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order
    env:
      # prisma.config.ts refuses an unset URL; generate never connects and
      # the e2e tests start their own Postgres container.
      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/order/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: npm audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:cov
      - name: Docker build
        run: docker build -t poro-order:${{ github.sha }} .
      - name: Trivy image scan (poro-order)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-order:${{ github.sha }}

  notification:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.notification == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification
    env:
      # prisma.config.ts refuses an unset URL; generate never connects and
      # the e2e tests start their own Postgres container.
      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/notification/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: npm audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:cov
      - name: Docker build
        run: docker build -t poro-notification:${{ github.sha }} .
      - name: Trivy image scan (poro-notification)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-notification:${{ github.sha }}

  moderation:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.moderation == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/moderation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.32
      - name: Install
        run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check src tests migrations
      - name: Lint
        run: uv run ruff check src tests migrations
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term
      - name: Audit
        run: uv run pip-audit --skip-editable
      - name: Docker build
        run: docker build -t poro-moderation:${{ github.sha }} .
      - name: Trivy image scan (poro-moderation)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-moderation:${{ github.sha }}

  video:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.video == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/video
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/video/go.mod
          cache-dependency-path: |
            services/video/go.sum
            packages/shared-go/go.sum
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: services/video
          args: --config ../../.golangci.yml

      - name: Tests
        run: go test ./... -count=1 -coverprofile=coverage.out
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Docker build
        working-directory: .
        run: |
          docker build -f services/video/Dockerfile -t poro-video:${{ github.sha }} .
          docker build -f services/video/Dockerfile.worker -t poro-media-worker:${{ github.sha }} .
      - name: Trivy image scan (poro-video)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-video:${{ github.sha }}
      - name: Trivy image scan (poro-media-worker)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-media-worker:${{ github.sha }}

  social:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.social == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/social
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/social/go.mod
          cache-dependency-path: |
            services/social/go.sum
            packages/shared-go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: services/social
          args: --config ../../.golangci.yml
      - name: Unit and integration tests
        run: go test ./... -count=1 -race -coverpkg=./internal/... -coverprofile=coverage.out
      - name: Coverage at least 70%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 70) }'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Docker build
        working-directory: .
        run: docker build -f services/social/Dockerfile -t poro-social:${{ github.sha }} .
      - name: Trivy image scan (poro-social)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-social:${{ github.sha }}

