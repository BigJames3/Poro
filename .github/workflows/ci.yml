name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      shared-go: ${{ steps.filter.outputs.shared-go }}
      auth: ${{ steps.filter.outputs.auth }}
      relay: ${{ steps.filter.outputs.relay }}
      user: ${{ steps.filter.outputs.user }}
      video: ${{ steps.filter.outputs.video }}
      social: ${{ steps.filter.outputs.social }}
      feed: ${{ steps.filter.outputs.feed }}
      notification: ${{ steps.filter.outputs.notification }}
      moderation: ${{ steps.filter.outputs.moderation }}
      search: ${{ steps.filter.outputs.search }}
      shop: ${{ steps.filter.outputs.shop }}
      order: ${{ steps.filter.outputs.order }}
      mobile: ${{ steps.filter.outputs.mobile }}
      gateway: ${{ steps.filter.outputs.gateway }}
      storage: ${{ steps.filter.outputs.storage }}
      backup: ${{ steps.filter.outputs.backup }}
      observability: ${{ steps.filter.outputs.observability }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            shared-go:
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            auth:
              - 'services/auth/**'
              - 'packages/shared-go/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            relay:
              - 'services/outbox-relay/**'
              - 'packages/shared-go/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            user:
              - 'services/user/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            video:
              - 'services/video/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            social:
              - 'services/social/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            feed:
              - 'services/feed/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            notification:
              - 'services/notification/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            moderation:
              - 'services/moderation/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            search:
              - 'services/search/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            shop:
              - 'services/shop/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            order:
              - 'services/order/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            mobile:
              - 'apps/mobile-android/**'
            gateway:
              - 'infra/gateway/**'
              - 'docs/api/**'
              - 'docker-compose.yml'
              - 'services/auth/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            observability:
              - 'infra/observability/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            backup:
              - 'infra/backup/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            storage:
              - 'infra/storage/**'
              - 'docker-compose.yml'
              - 'services/video/internal/storage/**'
              - 'services/video/internal/model/**'
              - 'services/video/internal/config/**'
              - 'services/video/cmd/storage-migrate/**'
              - 'services/video/go.mod'
              - 'services/video/go.sum'
              - 'services/user/src/avatars/**'
              - 'services/user/src/config/**'
              - 'services/user/test/seaweedfs.e2e.spec.ts'
              - 'services/user/package-lock.json'
              - 'services/shop/src/media/**'
              - 'services/shop/src/config/**'
              - 'services/shop/test/seaweedfs.e2e.spec.ts'
              - 'services/shop/package-lock.json'
              - '.github/workflows/ci.yml'

  security:
    # Runs on every change: a secret can land in any file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy repository scan (secrets, misconfigurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          skip-dirs: "**/node_modules,**/.venv"
          exit-code: "1"
          format: table

  gateway:
    # Routes come from docs/api: a documented route without a gateway rule fails here.
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/auth/go.mod
          cache-dependency-path: |
            services/auth/go.sum
            packages/shared-go/go.sum

      - name: shellcheck
        run: shellcheck infra/gateway/tests/*.sh

      - name: Routing contract (every documented route, limits, CORS, compression)
        run: infra/gateway/tests/run.sh

      - name: End to end with the real auth service
        run: infra/gateway/tests/e2e_auth.sh

      # Third-party image: reported, not blocking. Bump the tag when Traefik
      # ships a release that fixes what this lists.
      - name: Trivy image report (traefik)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: traefik:v3.7.14
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

  storage:
    # SeaweedFS with the real init.sh: per-service identities, anonymous read
    # on public media only, and the video, user and shop storage code against it.
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.storage == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/video/go.mod
          cache-dependency-path: |
            services/video/go.sum
            packages/shared-go/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            services/user/package-lock.json
            services/shop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: shellcheck
        run: shellcheck infra/storage/init.sh infra/storage/tests/*.sh

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r infra/storage/tests/requirements.txt
          npm ci --no-audit --no-fund --prefix services/user
          npm ci --no-audit --no-fund --prefix services/shop

      - name: Access control, legacy migration and SDKs against SeaweedFS
        env:
          PYTHON: python
        run: infra/storage/tests/run.sh

  backup:
    # Encrypted dumps, restore into scratch databases, tamper and wrong-key
    # rejection, off-site copy to S3 (PORO-012).
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backup == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client
      - name: shellcheck
        run: shellcheck infra/backup/*.sh infra/backup/tests/*.sh
      - name: Backup and restore round trip
        run: infra/backup/tests/run.sh

  observability:
    # Alert rules unit tests, then Prometheus, Alertmanager and Grafana started
    # together with the Compose images (PORO-009).
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.observability == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: shellcheck infra/observability/tests/*.sh
      - name: Rules, configuration and stack
        run: infra/observability/tests/run.sh

  deploy:
    # deploy.sh against a real Compose project: healthy version goes live,
    # unhealthy version or failing migration rolls back (PORO-010). Also checks
    # that the staging layer replaces every local build with a published image.
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: shellcheck deploy/*.sh deploy/tests/*.sh
      - name: Staging layer uses published images only
        env:
          PORO_IMAGE_REGISTRY: ghcr.io/poro
          PORO_IMAGE_TAG: sha-0000000000000000000000000000000000000000
        run: |
          built=$(docker compose --env-file .env.example -f docker-compose.yml -f deploy/staging/compose.staging.yml \
            config --format json | jq -r '.services | to_entries[] | select(.value.build != null) | .key')
          if [ -n "$built" ]; then echo "built locally in staging: $built"; exit 1; fi
      - name: Deploy and rollback
        run: deploy/tests/run.sh

  shared-go:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.shared-go == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: packages/shared-go/go.mod
          cache-dependency-path: packages/shared-go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: packages/shared-go
          args: --config ../../.golangci.yml

      - name: Tests
        run: go test ./... -count=1 -cover

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  outbox-relay:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/outbox-relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/outbox-relay/go.mod
          cache-dependency-path: |
            services/outbox-relay/go.sum
            packages/shared-go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: services/outbox-relay
          args: --config ../../.golangci.yml

      - name: Tests
        run: go test ./... -count=1 -cover
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Docker build
        working-directory: .
        run: docker build -f services/outbox-relay/Dockerfile -t poro-outbox-relay:${{ github.sha }} .
      - name: Trivy image scan (poro-outbox-relay)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-outbox-relay:${{ github.sha }}

  auth:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/auth/go.mod
          cache-dependency-path: |
            services/auth/go.sum
            packages/shared-go/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: services/auth
          args: --config ../../.golangci.yml

      - name: Unit and integration tests
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Docker build
        working-directory: .
        run: docker build -f services/auth/Dockerfile -t poro-auth:${{ github.sha }} .
      - name: Trivy image scan (poro-auth)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-auth:${{ github.sha }}

  user:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.user == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user
    env:
      # prisma.config.ts refuses an unset URL; generate never connects and
      # the e2e tests start their own Postgres container.
      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/user/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: npm audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:cov
      - name: Docker build
        run: docker build -t poro-user:${{ github.sha }} .
      - name: Trivy image scan (poro-user)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-user:${{ github.sha }}

  shop:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.shop == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/shop
    env:
      # prisma.config.ts refuses an unset URL; generate never connects and
      # the e2e tests start their own Postgres container.
      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/shop/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: npm audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:cov
      - name: Docker build
        run: docker build -t poro-shop:${{ github.sha }} .
      - name: Trivy image scan (poro-shop)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-shop:${{ github.sha }}

  order:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.order == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order
    env:
      # prisma.config.ts refuses an unset URL; generate never connects and
      # the e2e tests start their own Postgres container.
      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/order/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: npm audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:cov
      - name: Docker build
        run: docker build -t poro-order:${{ github.sha }} .
      - name: Trivy image scan (poro-order)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-order:${{ github.sha }}

  notification:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.notification == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification
    env:
      # prisma.config.ts refuses an unset URL; generate never connects and
      # the e2e tests start their own Postgres container.
      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/notification/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: npm audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:cov
      - name: Docker build
        run: docker build -t poro-notification:${{ github.sha }} .
      - name: Trivy image scan (poro-notification)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-notification:${{ github.sha }}

  moderation:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.moderation == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/moderation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.11.32
      - name: Install
        run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check src tests migrations
      - name: Lint
        run: uv run ruff check src tests migrations
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term
      - name: Audit
        run: uv run pip-audit --skip-editable
      - name: Docker build
        run: docker build -t poro-moderation:${{ github.sha }} .
      - name: Trivy image scan (poro-moderation)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-moderation:${{ github.sha }}

  video:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.video == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/video
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/video/go.mod
          cache-dependency-path: |
            services/video/go.sum
            packages/shared-go/go.sum
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: services/video
          args: --config ../../.golangci.yml

      - name: Tests
        run: go test ./... -count=1 -race -coverprofile=coverage.out
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Docker build
        working-directory: .
        run: |
          docker build -f services/video/Dockerfile -t poro-video:${{ github.sha }} .
          docker build -f services/video/Dockerfile.worker -t poro-media-worker:${{ github.sha }} .
      - name: Trivy image scan (poro-video)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-video:${{ github.sha }}
      - name: Trivy image scan (poro-media-worker)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-media-worker:${{ github.sha }}

  social:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.social == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/social
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/social/go.mod
          cache-dependency-path: |
            services/social/go.sum
            packages/shared-go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: services/social
          args: --config ../../.golangci.yml
      - name: Unit and integration tests
        run: go test ./... -count=1 -race -coverpkg=./internal/... -coverprofile=coverage.out
      - name: Coverage at least 70%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 70) }'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Docker build
        working-directory: .
        run: docker build -f services/social/Dockerfile -t poro-social:${{ github.sha }} .
      - name: Trivy image scan (poro-social)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-social:${{ github.sha }}

