      - name: Trivy image scan (poro-feed)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-feed:${{ github.sha }}

  search:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.search == 'true' }}
    runs-on: ubuntu-latest
    defaults:
