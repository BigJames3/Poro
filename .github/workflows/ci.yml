  mobile-build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      # The wrapper is committed without the executable bit: run it through bash.
      - name: Assemble debug build
        working-directory: apps/mobile-android
        run: bash ./gradlew --no-daemon assembleDebug

  repo-checks:
    # Every change: a broken workflow, docker-compose.yml or infra script
    # breaks CI or every developer's environment, whatever the service touched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/auth/go.mod
          cache: false
      - name: actionlint (workflows)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Compose file is valid with the documented variables
        run: docker compose --env-file .env.example config --quiet
      - name: shellcheck (infra scripts)
        run: shellcheck infra/media-worker/*.sh

  ci-ok:
    # The single check to require in branch protection: it fails when any job
    # failed or was cancelled. Jobs skipped by detect-changes count as passed.
    if: ${{ always() }}
    needs:
      - detect-changes
      - security
      - repo-checks
      - gateway
      - storage
      - backup
      - observability
      - deploy
      - shared-go
      - outbox-relay
      - auth
      - user
      - shop
      - order
      - notification
      - moderation
      - video
      - social
      - feed
      - search
      - mobile-build
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required job ended with: $r"; exit 1 ;;
            esac
          done
