name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      shared-go: ${{ steps.filter.outputs.shared-go }}
      auth: ${{ steps.filter.outputs.auth }}
      relay: ${{ steps.filter.outputs.relay }}
      user: ${{ steps.filter.outputs.user }}
      video: ${{ steps.filter.outputs.video }}
      social: ${{ steps.filter.outputs.social }}
      feed: ${{ steps.filter.outputs.feed }}
      notification: ${{ steps.filter.outputs.notification }}
      moderation: ${{ steps.filter.outputs.moderation }}
      search: ${{ steps.filter.outputs.search }}
      shop: ${{ steps.filter.outputs.shop }}
      order: ${{ steps.filter.outputs.order }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            shared-go:
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            auth:
              - 'services/auth/**'
              - 'packages/shared-go/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            relay:
              - 'services/outbox-relay/**'
              - 'packages/shared-go/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            user:
              - 'services/user/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            video:
              - 'services/video/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            social:
              - 'services/social/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            feed:
              - 'services/feed/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            notification:
              - 'services/notification/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            moderation:
              - 'services/moderation/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            search:
              - 'services/search/**'
              - 'packages/shared-go/**'
              - 'packages/contracts/events/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            shop:
              - 'services/shop/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            order:
              - 'services/order/**'
              - 'packages/contracts/events/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            mobile:
              - 'apps/mobile-android/**'

  security:
    # Runs on every change: a secret can land in any file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy repository scan (secrets, misconfigurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          skip-dirs: "**/node_modules,**/.venv"
          exit-code: "1"
          format: table

  shared-go:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.shared-go == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: packages/shared-go/go.mod
          cache-dependency-path: packages/shared-go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: packages/shared-go
          args: --config ../../.golangci.yml

      - name: Tests
        run: go test ./... -count=1 -cover

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  outbox-relay:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/outbox-relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/outbox-relay/go.mod
          cache-dependency-path: |
            services/outbox-relay/go.sum
            packages/shared-go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: services/outbox-relay
          args: --config ../../.golangci.yml

      - name: Tests
        run: go test ./... -count=1 -cover
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Docker build
        working-directory: .
        run: docker build -f services/outbox-relay/Dockerfile -t poro-outbox-relay:${{ github.sha }} .
      - name: Trivy image scan (poro-outbox-relay)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-outbox-relay:${{ github.sha }}

  auth:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: services/auth/go.mod
          cache-dependency-path: |
            services/auth/go.sum
            packages/shared-go/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: services/auth
          args: --config ../../.golangci.yml

      - name: Unit and integration tests
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Docker build
        working-directory: .
        run: docker build -f services/auth/Dockerfile -t poro-auth:${{ github.sha }} .
      - name: Trivy image scan (poro-auth)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-auth:${{ github.sha }}

  user:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.user == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user
    env:
      # prisma.config.ts refuses an unset URL; generate never connects and
      # the e2e tests start their own Postgres container.
      DATABASE_URL: postgresql://ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/user/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: npm audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test:cov
      - name: Docker build
        run: docker build -t poro-user:${{ github.sha }} .
      - name: Trivy image scan (poro-user)
        uses: ./.github/actions/trivy-image
        with:
          image: poro-user:${{ github.sha }}

  shop:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.shop == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/shop
    env:
      # prisma.config.ts refuses an unset URL; generate never connects and
