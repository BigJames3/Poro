name: Deploy staging

# Manual deployment of one commit to staging (PORO-010). There is no
# production deployment workflow: production needs an approved hosting setup,
# protected secrets and a rehearsed restore first (docs/runbooks/deploy.md).
#
# Requires the GitHub environment "staging" (Settings → Environments), with
# required reviewers, and its secrets:
#   STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_PRIVATE_KEY,
#   STAGING_SSH_KNOWN_HOSTS (pinned host key, never trust on first use)
# and variables STAGING_APP_DIR (checkout on the host) and STAGING_BASE_URL.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit sha on main whose images CI published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - name: Check inputs and configuration
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.STAGING_APP_DIR }}
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit sha"; exit 1; }
          missing=""
          for v in HOST KEY KNOWN APP_DIR BASE_URL; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "staging environment is not configured (missing:$missing): see docs/runbooks/deploy.md"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: The commit is on main
        run: git merge-base --is-ancestor "$SHA" origin/main

      - name: Images exist and were built by this repository's CI
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in poro-auth poro-outbox-relay poro-video poro-media-worker poro-social poro-feed \
            poro-search poro-user poro-shop poro-order poro-notification poro-moderation; do
            ref="oci://ghcr.io/${OWNER,,}/$image:sha-$SHA"
            gh attestation verify "$ref" --repo "$GITHUB_REPOSITORY" >/dev/null
            echo "verified $image"
          done

      - name: Deploy on the staging host
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER_NAME: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.STAGING_APP_DIR }}
          OWNER: ${{ github.repository_owner }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # deploy.sh rolls back by itself when the new version is not healthy.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER_NAME@$HOST" \
            "set -e; cd '$APP_DIR'; git fetch --quiet origin; git checkout --quiet --detach '$SHA'; \
             PORO_IMAGE_REGISTRY='ghcr.io/${OWNER,,}' deploy/deploy.sh '$SHA'"

      - name: Smoke test through the public gateway
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          # The gateway answers, and routes to an API that enforces auth.
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${BASE_URL%/}$1")
            echo "$1 -> $code (want $2)"
            [ "$code" = "$2" ]
          }
          check /health 200
          check /api/v1/users/me 401
