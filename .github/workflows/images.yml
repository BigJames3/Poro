name: Images

# Publishes the service images to GHCR once CI has passed on main. Tags are
# immutable and traceable: sha-<full commit sha>, never latest. A tag that
# already exists is never overwritten. Each image carries a signed build
# provenance attestation (who built it, from which commit and workflow).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    # Only after a green CI run on a push to main, never for pull requests
    # (a fork must not be able to publish).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: poro-auth, context: ., dockerfile: services/auth/Dockerfile }
          - { image: poro-outbox-relay, context: ., dockerfile: services/outbox-relay/Dockerfile }
          - { image: poro-video, context: ., dockerfile: services/video/Dockerfile }
          - { image: poro-media-worker, context: ., dockerfile: services/video/Dockerfile.worker }
          - { image: poro-social, context: ., dockerfile: services/social/Dockerfile }
          - { image: poro-feed, context: ., dockerfile: services/feed/Dockerfile }
          - { image: poro-search, context: ., dockerfile: services/search/Dockerfile }
          - { image: poro-user, context: services/user, dockerfile: services/user/Dockerfile }
          - { image: poro-shop, context: services/shop, dockerfile: services/shop/Dockerfile }
          - { image: poro-order, context: services/order, dockerfile: services/order/Dockerfile }
          - { image: poro-notification, context: services/notification, dockerfile: services/notification/Dockerfile }
          - { image: poro-moderation, context: services/moderation, dockerfile: services/moderation/Dockerfile }
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Image reference
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          # GHCR names are lower case.
          repo="ghcr.io/${OWNER,,}/${IMAGE}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$repo:sha-$SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        id: exists
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published: tags are immutable, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (local, for the scan)
        if: ${{ steps.exists.outputs.skip == 'false' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.ref.outputs.tag }}

      - name: Trivy image scan
        if: ${{ steps.exists.outputs.skip == 'false' }}
        uses: ./.github/actions/trivy-image
        with:
          image: ${{ steps.ref.outputs.tag }}

      - name: Push
        id: push
        if: ${{ steps.exists.outputs.skip == 'false' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.ref.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build provenance attestation
        if: ${{ steps.exists.outputs.skip == 'false' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
