name: Trivy image scan
description: >
  Fails on HIGH or CRITICAL vulnerabilities that have a fixed version in an
  image built earlier in the job. Unfixed ones are reported, not blocking.
inputs:
  image:
    description: Local image reference, for instance poro-auth:<sha>
    required: true
runs:
  using: composite
  steps:
    - name: Trivy (blocking, fixable HIGH and CRITICAL)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.75.0
        image-ref: ${{ inputs.image }}
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        format: table
    - name: Trivy (report only, unfixed)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.75.0
        image-ref: ${{ inputs.image }}
        scanners: vuln
        severity: HIGH,CRITICAL
        exit-code: "0"
        format: table
        skip-setup-trivy: true
