openapi: 3.1.0
info:
  title: PORO Auth API
  version: 1.1.0
  description: |
    Identity, device sessions and token issuance for PORO.
    Every JSON response uses the envelope `{data, error, meta}`; `meta.request_id`
    echoes the `X-Request-ID` header. Clients must branch on `error.code`, never on `error.message`.
servers:
  - url: http://localhost:8081
    description: Local development
tags:
  - name: otp
  - name: email
  - name: session
  - name: account
  - name: admin
  - name: platform
paths:
  /api/v1/auth/otp/request:
    post:
      tags: [otp]
      security: []
      summary: Send a 6-digit code by SMS
      description: |
        Only numbers from the launch countries (+225, +221, +237, +234) are accepted.
        Rate limited to 5 requests/min per IP, one code per phone every 60 s and 5 per hour.
        A failed delivery lifts the 60 s cooldown but still counts toward the hourly cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: E.164 number, example: "+2250700000000" }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string, example: otp sent }
                          expires_in: { type: integer, description: seconds, example: 300 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "422":
          description: "`phone_country_not_supported` (outside the launch countries) or `phone_unreachable` (the SMS provider refuses the number)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "503":
          description: "`sms_unavailable`: provider failure (the client may retry immediately), or the platform's daily SMS budget is spent (ADR-0017): sign in by email until the next UTC day"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: "`otp_throttled` (per phone, number range or country: SMS budget, ADR-0017) or `rate_limited` (per IP)"
          headers:
            Retry-After: { schema: { type: integer }, description: "seconds, present for otp_throttled" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/auth/otp/verify:
    post:
      tags: [otp]
      security: []
      summary: Verify the code and sign in, creating the account on first use
      description: A code is single use and allows 3 attempts. 20 requests/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: "+2250700000000" }
                code: { type: string, pattern: "^[0-9]{6}$" }
                device_name: { type: string, maxLength: 60, description: "Shown in the session list, e.g. \"Tecno Spark 20\"" }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: "`otp_invalid` or `otp_expired`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "403": { $ref: "#/components/responses/Blocked" }
        "429":
          description: "`otp_too_many_attempts` (request a new code) or `rate_limited`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /api/v1/auth/email/register:
    post:
      tags: [email]
      security: []
      summary: Create an account with email and password
      description: |
        The email is trimmed and lowercased. 10 requests/min per IP. A verification code is
        emailed in the background; a delivery failure never fails the sign-up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 128 }
                full_name: { type: string, minLength: 2, maxLength: 100 }
                device_name: { type: string, maxLength: 60, description: "Shown in the session list, e.g. \"Tecno Spark 20\"" }
      responses:
        "201": { $ref: "#/components/responses/Auth" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409":
          description: "`email_taken`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/email/login:
    post:
      tags: [email]
      security: []
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, maxLength: 128 }
                device_name: { type: string, maxLength: 60, description: "Shown in the session list, e.g. \"Tecno Spark 20\"" }
      responses:
        "200": { $ref: "#/components/responses/Auth" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: "`invalid_credentials` (same answer for unknown email and wrong password)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "403": { $ref: "#/components/responses/Blocked" }
        "429": { $ref: "#/components/responses/LoginThrottled" }
  /api/v1/auth/email/verification/request:
    post:
      tags: [email]
      summary: Email a verification code to the account's address
      description: |
        Six digits, valid 15 minutes, 5 attempts. One email per address every 60 s and 5 per hour,
        verification and reset codes together. A new code voids the previous one. 10 requests/min per IP.
      security: [{ bearer: [] }]
      responses:
        "202": { $ref: "#/components/responses/CodeSent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Blocked" }
        "409":
          description: "`email_already_verified`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422":
          description: "`email_missing`: the account signs in by phone"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/EmailThrottled" }
        "503":
          description: "`email_unavailable`: the relay refused or could not be reached; retry"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /api/v1/auth/email/verification/confirm:
    post:
      tags: [email]
      summary: Verify the address with the emailed code
      description: Confirming an address already verified returns the account unchanged.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Account, `email_verified` true
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/CodeRejected" }
        "429": { $ref: "#/components/responses/CodeTooManyAttempts" }
  /api/v1/auth/email/password/forgot:
    post:
      tags: [email]
      security: []
      summary: Email a password reset code
      description: |
        Always `202` with the same body, whether or not an account uses the address, and even if the
        email could not be sent: the answer reveals no account. Same code rules and limits as the
        verification. 10 requests/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202": { $ref: "#/components/responses/CodeSent" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "429": { $ref: "#/components/responses/EmailThrottled" }
  /api/v1/auth/email/password/reset:
    post:
      tags: [email]
      security: []
      summary: Choose a new password with the emailed code
      description: |
        Sets the password, marks the address verified and signs every device out (all refresh
        tokens revoked). An unknown address fails like a wrong code. 10 requests/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, pattern: "^[0-9]{6}$" }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: "Password changed, every session ended" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "403": { $ref: "#/components/responses/Blocked" }
        "422": { $ref: "#/components/responses/CodeRejected" }
        "429": { $ref: "#/components/responses/CodeTooManyAttempts" }
  /api/v1/auth/refresh:
    post:
      tags: [session]
      security: []
      summary: Rotate the refresh token
      description: |
        Returns a new access token and a new refresh token; the old refresh token stops working.
        Clients must send at most one refresh at a time. Replaying a token that was already rotated
        revokes the whole device session (`session_revoked`), except for a retry within 30 s whose
        response was lost.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: "`refresh_token_invalid` or `session_revoked`: sign in again"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "403": { $ref: "#/components/responses/Blocked" }
  /api/v1/auth/logout:
    post:
      tags: [session]
      summary: End the current device session
      security: [{ bearer: [] }]
      responses:
        "204": { description: "Access token blacklisted, session refresh tokens revoked" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/me:
    get:
      tags: [session]
      summary: Current account
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/sessions:
    get:
      tags: [session]
      summary: Signed-in devices of the account
      description: |
        Every session that can still refresh, most recently used first. `device` is the
        `device_name` given at sign-in, else the User-Agent (100 characters at most), else null.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [session]
      summary: Sign a device out
      description: |
        Revokes the refresh tokens of that session. Revoking the current session is a logout.
        The session also enters the shared revocation registry (ADR-0016): access tokens
        already issued to the device are refused at once (401 `session_revoked`).
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`session_not_found`: unknown, ended, or another account's"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /api/v1/auth/sessions/revoke-others:
    post:
      tags: [session]
      summary: Sign every other device out
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Number of sessions ended
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/me/delete:
    post:
      tags: [account]
      summary: Ask for the deletion of the account
      description: |
        The owner proves it again: `password` for an email account, `otp_code` for a phone
        account (request it first with `POST /otp/request`). The account is erased 30 days
        later; every device is signed out now. Signing in again before that date cancels the
        deletion. Asking twice keeps the first date. 10 requests/min per IP.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, maxLength: 128 }
                otp_code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "202":
          description: Deletion scheduled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deletion_scheduled_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: "`unauthorized`, `invalid_credentials`, `otp_invalid` or `otp_expired`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "403": { $ref: "#/components/responses/Blocked" }
        "422":
          description: "`reauth_required`: the password (email account) or the code (phone account) is missing"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: "`otp_too_many_attempts`, `login_throttled` (too many wrong passwords: the same lock as sign-in, header `Retry-After`) or `rate_limited`"
          headers:
            Retry-After: { schema: { type: integer }, description: "seconds, present for login_throttled" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /api/v1/auth/me/delete/cancel:
    post:
      tags: [account]
      summary: Cancel a pending deletion
      description: Without a pending deletion, returns the account unchanged.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/admin/users/{id}/suspend:
    post:
      tags: [admin]
      summary: Suspend an account everywhere (ADMIN or MODERATOR)
      description: |
        Marks the account SUSPENDED and revokes every session in the shared registry
        (ADR-0016, ADR-0019): every service refuses its access tokens at once, and auth
        refuses its sign-ins and refreshes (403 `account_blocked`). Idempotent; repeating
        a call that failed half-way completes it. A MODERATOR may not target an ADMIN
        or a MODERATOR. Each call is logged with the actor, the target and the time.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Suspended account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden`: the caller is neither ADMIN nor MODERATOR, or a MODERATOR targets an ADMIN or a MODERATOR"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: "`account_not_found`: unknown or deleted account"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422":
          description: "`self_suspension`: an administrator cannot suspend their own account"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /api/v1/auth/admin/users/{id}/reinstate:
    post:
      tags: [admin]
      summary: Lift a suspension (ADMIN or MODERATOR)
      description: |
        The account returns to PENDING; its next sign-in makes it ACTIVE. Idempotent.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden`: the caller is neither ADMIN nor MODERATOR, or a MODERATOR targets an ADMIN or a MODERATOR"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: "`account_not_found`: unknown or deleted account"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /.well-known/jwks.json:
    get:
      tags: [platform]
      security: []
      summary: Public signing keys (RFC 7517), cached 5 minutes
      responses:
        "200":
          description: JWK set
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty: { type: string, example: RSA }
                        use: { type: string, example: sig }
                        alg: { type: string, example: RS256 }
                        kid: { type: string, description: RFC 7638 thumbprint }
                        n: { type: string }
                        e: { type: string }
  /health/live:
    get:
      tags: [platform]
      security: []
      summary: Liveness probe, no dependency check
      responses:
        "200": { description: Process is running }
  /health/ready:
    get:
      tags: [platform]
      security: []
      summary: Readiness probe, checks Postgres and Redis
      responses:
        "200": { description: Ready }
        "503": { description: A dependency is down }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256, header `kid`. Claims: `sub` (user UUID), `roles` (array), `sid` (device session),
        `jti`, `iss=poro-auth`, `aud=poro-api`, `iat`, `nbf`, `exp` (15 min).
  schemas:
    Envelope:
      type: object
      required: [data, error, meta]
      properties:
        data: {}
        error: { type: "null" }
        meta:
          type: object
          properties:
            request_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { type: "null" }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_json
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - payload_too_large
                - rate_limited
                - unavailable
                - email_taken
                - account_blocked
                - account_not_found
                - otp_invalid
                - otp_expired
                - otp_too_many_attempts
                - otp_throttled
                - phone_country_not_supported
                - phone_unreachable
                - sms_unavailable
                - invalid_credentials
                - refresh_token_invalid
                - session_revoked
                - session_not_found
                - reauth_required
                - email_missing
                - email_already_verified
                - email_throttled
                - email_unavailable
                - code_invalid
                - code_expired
                - code_too_many_attempts
                - internal_error
            message: { type: string }
        meta:
          type: object
          properties:
            request_id: { type: string }
    Tokens:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: access token lifetime in seconds }
        token_type: { type: string, example: Bearer }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        email: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [PERSONAL, CREATOR, BUSINESS, ENTERPRISE, ADMIN, MODERATOR, SUPPORT]
        status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, DELETED] }
        country_code: { type: string }
        language: { type: string }
        created_at: { type: string, format: date-time }
        email_verified: { type: boolean, description: True once the owner proved they read the address. }
        deletion_scheduled_at:
          type: ["string", "null"]
          format: date-time
          description: When the account will be erased; null when no deletion is pending.
    Session:
      type: object
      required: [id, device, ip_address, created_at, last_active_at, current]
      properties:
        id: { type: string, format: uuid, description: "Also the `sid` claim of its access tokens" }
        device: { type: ["string", "null"] }
        ip_address: { type: ["string", "null"], description: Address at sign-in }
        created_at: { type: string, format: date-time, description: Sign-in }
        last_active_at: { type: string, format: date-time, description: Latest refresh }
        current: { type: boolean, description: The session of the calling access token }
  responses:
    Auth:
      description: Signed in
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Tokens"
                      - type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
                          deletion_cancelled:
                            type: boolean
                            description: Present and true when this sign-in cancelled a pending deletion.
    InvalidRequest:
      description: "`invalid_json` or `invalid_request`"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Unauthorized:
      description: "`unauthorized`: missing, expired, forged or revoked access token"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Blocked:
      description: "`account_blocked`"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    CodeSent:
      description: Code on its way
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      expires_in: { type: integer, description: code lifetime in seconds }
    EmailThrottled:
      description: "`email_throttled` (header `Retry-After` in seconds) or `rate_limited`"
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    CodeRejected:
      description: "`code_invalid` (wrong, used or unknown) or `code_expired`: ask for a new code"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    CodeTooManyAttempts:
      description: "`code_too_many_attempts`: ask for a new code; or `rate_limited`"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    RateLimited:
      description: "`rate_limited`"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    LoginThrottled:
      description: >-
        `login_throttled`: too many wrong passwords for this account, from any IP (ADR-0017).
        Locked 1 minute after 5 failures, doubled by each further failure, 15 minutes at most;
        the password is not checked while locked. Same answer for unknown addresses.
        Or `rate_limited` (per IP).
      headers:
        Retry-After: { schema: { type: integer }, description: "seconds, present for login_throttled" }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
