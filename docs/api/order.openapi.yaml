openapi: 3.1.0
info:
  title: PORO Order API
  version: 1.0.0
  description: |
    Cart, checkout and orders of the PORO marketplace. Every route needs a
    token; every JSON response uses `{data, error, meta}`. Amounts are
    integers in minor units of the order currency (XOF and XAF have none,
    NGN is in kobo).

    Checkout has two steps: a recap (preview) then an explicit
    confirmation; orders only exist after the confirmation. Checkout splits
    the cart into one order per shop. Each order starts
    `pending` until the shop reserves the stock; the reserved price is
    authoritative and may differ from the cart price. Cash on delivery goes
    to `confirmed`, other methods to `awaiting_payment` for 30 minutes.

    Error codes besides the generic ones: `variant_unavailable`, `own_shop`,
    `cart_full`, `cart_empty`, `cart_unavailable`, `too_many_lines`,
    `payment_method_unavailable`, `delivery_invalid`,
    `delivery_location_required`, `confirmation_required`,
    `address_book_full`, `address_label_invalid`, `tracking_invalid` (422);
    `invalid_cursor` (400); `preview_outdated`, `preview_expired`,
    `order_status_conflict` (409); `preview_not_found`, `address_not_found`,
    `order_not_found` (404).
servers:
  - url: http://localhost:8091
    description: Local development
tags:
  - name: cart
  - name: checkout
  - name: addresses
  - name: orders
  - name: seller
  - name: platform
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [platform]
      security: []
      summary: Liveness
      responses:
        "200": { description: Process up }
  /health/ready:
    get:
      tags: [platform]
      security: []
      summary: Readiness, Postgres and Redis (also at /health)
      responses:
        "200": { description: Ready }
        "503": { description: A dependency is down }
  /api/v1/cart:
    get:
      tags: [cart]
      summary: The cart grouped by shop, with current catalogue prices
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [cart]
      summary: Empty the cart
      responses:
        "200": { $ref: "#/components/responses/Cart" }
  /api/v1/cart/items/{variantId}:
    parameters:
      - name: variantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [cart]
      summary: Set the quantity of a variant (100 lines at most)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [cart]
      summary: Remove a variant from the cart
      responses:
        "200": { $ref: "#/components/responses/Cart" }
  /api/v1/checkout/prefill:
    get:
      tags: [checkout]
      summary: The delivery contact to start from
      description: |
        The default saved address, else the name (user service) and phone
        (auth service) of the account, read with the caller's token. A slow
        or failing service only leaves its field empty.
      responses:
        "200":
          description: Prefilled contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      source: { enum: [address_book, account, empty] }
                      address_id: { type: ["string", "null"], format: uuid }
                      delivery:
                        type: object
                        properties:
                          full_name: { type: ["string", "null"] }
                          phone: { type: ["string", "null"] }
                          city: { type: ["string", "null"] }
                          address: { type: ["string", "null"] }
                          landmark: { type: ["string", "null"] }
                          location:
                            oneOf:
                              - { $ref: "#/components/schemas/Location" }
                              - { type: "null" }
                      account_lookup: { enum: [ok, partial, unavailable, skipped] }
                  error: { type: "null" }
                  meta: { $ref: "#/components/schemas/Meta" }
  /api/v1/checkout/preview:
    post:
      tags: [checkout]
      summary: The full recap to review; nothing is ordered yet
      description: |
        Validates the cart and the delivery and returns items, quantities,
        totals per currency, contact, address, payment method and the
        delivery fee notice. Valid 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [delivery]
              properties:
                delivery: { $ref: "#/components/schemas/DeliveryInput" }
                payment_method: { enum: [cash_on_delivery, wave, simulated], default: cash_on_delivery }
                save_address: { type: boolean, description: Add the delivery to the address book once confirmed }
                address_label: { type: ["string", "null"], maxLength: 40 }
      responses:
        "201":
          description: The recap
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Preview" }
                  error: { type: "null" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/confirm:
    post:
      tags: [checkout]
      summary: Place the orders of a reviewed recap
      description: |
        Requires `confirmed: true`. Creates one order per shop only while
        the cart and its prices still match the recap. Confirming the same
        recap again returns the same orders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preview_id, confirmed]
              properties:
                preview_id: { type: string, format: uuid }
                confirmed: { type: boolean }
      responses:
        "201":
          description: The orders created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      checkout_id: { type: string, format: uuid }
                      orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
                      address_saved: { type: boolean }
                  error: { type: "null" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/addresses:
    get:
      tags: [addresses]
      summary: Saved delivery addresses, default first
      responses:
        "200":
          description: The address book
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Address" } }
                  error: { type: "null" }
                  meta: { $ref: "#/components/schemas/Meta" }
    post:
      tags: [addresses]
      summary: Save an address (10 at most); the first one becomes the default
      requestBody: { $ref: "#/components/requestBodies/AddressInput" }
      responses:
        "201": { $ref: "#/components/responses/Address" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/addresses/{addressId}:
    parameters: [{ $ref: "#/components/parameters/AddressId" }]
    put:
      tags: [addresses]
      summary: Replace an address
      requestBody: { $ref: "#/components/requestBodies/AddressInput" }
      responses:
        "200": { $ref: "#/components/responses/Address" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [addresses]
      summary: Delete an address; the most recent one becomes the default
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/addresses/{addressId}/default:
    parameters: [{ $ref: "#/components/parameters/AddressId" }]
    post:
      tags: [addresses]
      summary: Make an address the default
      responses:
        "200": { $ref: "#/components/responses/Address" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/orders:
    get:
      tags: [orders]
      summary: Orders of the calling buyer, newest first
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Status" }
      responses:
        "200": { $ref: "#/components/responses/OrderPage" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/orders/{orderId}:
    parameters: [{ $ref: "#/components/parameters/OrderId" }]
    get:
      tags: [orders]
      summary: One order of the calling buyer
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/orders/{orderId}/cancel:
    parameters: [{ $ref: "#/components/parameters/OrderId" }]
    post:
      tags: [orders]
      summary: Cancel before shipping; a paid order is refunded
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/orders/{orderId}/confirm-receipt:
    parameters: [{ $ref: "#/components/parameters/OrderId" }]
    post:
      tags: [orders]
      summary: Confirm receipt of a shipped order; it completes
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/seller/orders:
    get:
      tags: [seller]
      summary: Orders of the calling seller's shop, newest first
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Status" }
      responses:
        "200": { $ref: "#/components/responses/OrderPage" }
  /api/v1/seller/orders/{orderId}:
    parameters: [{ $ref: "#/components/parameters/OrderId" }]
    get:
      tags: [seller]
      summary: One order of the calling seller, with the delivery contact
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/seller/orders/{orderId}/ship:
    parameters: [{ $ref: "#/components/parameters/OrderId" }]
    post:
      tags: [seller]
      summary: Mark a confirmed or paid order shipped
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tracking: { type: ["string", "null"], description: "Free text, 200 characters at most" }
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/seller/orders/{orderId}/cancel:
    parameters: [{ $ref: "#/components/parameters/OrderId" }]
    post:
      tags: [seller]
      summary: Cancel before shipping; a paid order is refunded
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    AddressInput:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/DeliveryInput" }
              - type: object
                properties:
                  label: { type: ["string", "null"], maxLength: 40, examples: [Maison] }
                  is_default: { type: boolean }
  parameters:
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` of the previous page; omit for page 1.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Status:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/OrderStatus" }
  responses:
    Error:
      description: Error envelope, see `error.code`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Cart:
      description: The cart
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Cart" }
              error: { type: "null" }
              meta: { $ref: "#/components/schemas/Meta" }
    Order:
      description: The order
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Order" }
              error: { type: "null" }
              meta: { $ref: "#/components/schemas/Meta" }
    Address:
      description: The address
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Address" }
              error: { type: "null" }
              meta: { $ref: "#/components/schemas/Meta" }
    OrderPage:
      description: A page of orders
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Order" } }
                  next_cursor: { type: ["string", "null"] }
              error: { type: "null" }
              meta: { $ref: "#/components/schemas/Meta" }
  schemas:
    Meta:
      type: object
      properties:
        request_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { type: "null" }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [cart_empty, own_shop, order_status_conflict] }
            message: { type: string }
        meta: { $ref: "#/components/schemas/Meta" }
    OrderStatus: { enum: [pending, awaiting_payment, confirmed, paid, shipped, completed, cancelled] }
    Location:
      type: object
      description: GPS position shared by the device, only when the buyer allows it
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: ["integer", "null"], minimum: 0, maximum: 100000 }
    DeliveryInput:
      type: object
      description: Name, phone and city are required, plus a location or an address
      required: [full_name, phone, city]
      properties:
        full_name: { type: string, description: "Nom et prénom, 1 to 80 characters" }
        phone: { type: string, pattern: "^\\+[1-9]\\d{7,14}$", examples: ["+2250700000000"] }
        city: { type: string, description: 1 to 80 characters }
        address: { type: ["string", "null"], description: "Street or neighbourhood, 300 characters and 3 lines at most" }
        landmark: { type: ["string", "null"], description: "Directions to find the place, optional" }
        location:
          oneOf:
            - { $ref: "#/components/schemas/Location" }
            - { type: "null" }
    Delivery:
      type: object
      properties:
        full_name: { type: string }
        phone: { type: string }
        city: { type: string }
        address: { type: ["string", "null"] }
        landmark: { type: ["string", "null"] }
        location:
          oneOf:
            - { $ref: "#/components/schemas/Location" }
            - { type: "null" }
    Address:
      allOf:
        - { $ref: "#/components/schemas/Delivery" }
        - type: object
          properties:
            address_id: { type: string, format: uuid }
            label: { type: ["string", "null"] }
            is_default: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Preview:
      type: object
      properties:
        preview_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        shops:
          type: array
          items:
            type: object
            properties:
              shop:
                type: object
                properties:
                  shop_id: { type: string, format: uuid }
                  name: { type: string }
                  handle: { type: string }
              currency: { enum: [XOF, XAF, NGN] }
              items:
                type: array
                items:
                  type: object
                  properties:
                    product_id: { type: string, format: uuid }
                    variant_id: { type: string, format: uuid }
                    title: { type: string }
                    variant_title: { type: string }
                    image_url: { type: ["string", "null"], format: uri }
                    quantity: { type: integer }
                    unit_price: { type: integer }
                    line_total: { type: integer }
              subtotal: { type: integer }
        totals:
          type: array
          description: Total of the items per currency; delivery fees are not included
          items:
            type: object
            properties:
              currency: { enum: [XOF, XAF, NGN] }
              amount: { type: integer }
        item_count: { type: integer }
        delivery: { $ref: "#/components/schemas/Delivery" }
        payment_method: { enum: [cash_on_delivery, wave, simulated] }
        payment_method_label: { type: string, examples: [Paiement à la livraison] }
        delivery_fee_notice: { type: string, examples: ["Frais de livraison à régler au livreur, non inclus dans le total."] }
    CartLine:
      type: object
      properties:
        variant_id: { type: string, format: uuid }
        product_id: { type: ["string", "null"], format: uuid }
        title: { type: ["string", "null"] }
        variant_title: { type: ["string", "null"] }
        image_url: { type: ["string", "null"], format: uri }
        quantity: { type: integer }
        unit_price: { type: ["integer", "null"] }
        line_total: { type: ["integer", "null"] }
        in_stock: { type: boolean, description: A hint; the reservation decides }
        available: { type: boolean }
    Cart:
      type: object
      properties:
        shops:
          type: array
          items:
            type: object
            properties:
              shop:
                type: object
                properties:
                  shop_id: { type: string, format: uuid }
                  name: { type: string }
                  handle: { type: string }
                  currency: { enum: [XOF, XAF, NGN] }
              items: { type: array, items: { $ref: "#/components/schemas/CartLine" } }
              subtotal: { type: integer }
        unavailable: { type: array, items: { $ref: "#/components/schemas/CartLine" } }
        item_count: { type: integer }
    Order:
      type: object
      properties:
        order_id: { type: string, format: uuid }
        checkout_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OrderStatus" }
        shop:
          type: object
          properties:
            shop_id: { type: string, format: uuid }
            name: { type: string }
        buyer_id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        currency: { enum: [XOF, XAF, NGN] }
        payment_method: { enum: [cash_on_delivery, wave, simulated] }
        payment_method_label: { type: string, examples: [Paiement à la livraison] }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              variant_id: { type: string, format: uuid }
              title: { type: string }
              quantity: { type: integer }
              unit_price: { type: integer, description: Authoritative once reserved }
              unit_price_seen: { type: integer, description: The cart price at checkout }
        subtotal_seen: { type: integer }
        total: { type: ["integer", "null"], description: Null until the stock is reserved }
        delivery:
          oneOf:
            - { $ref: "#/components/schemas/Delivery" }
            - { type: "null", description: Erased 90 days after the order ended }
        tracking: { type: ["string", "null"] }
        cancel_reason: { enum: [stock_rejected, payment_timeout, buyer_cancelled, seller_cancelled, null] }
        paid: { type: boolean }
        last_payment_error: { type: ["string", "null"] }
        expires_at: { type: ["string", "null"], format: date-time }
        placed_at: { type: ["string", "null"], format: date-time }
        paid_at: { type: ["string", "null"], format: date-time }
        shipped_at: { type: ["string", "null"], format: date-time }
        completed_at: { type: ["string", "null"], format: date-time }
        cancelled_at: { type: ["string", "null"], format: date-time }
        refunded_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
