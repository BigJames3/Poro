openapi: 3.1.0
info:
  title: PORO Video API
  version: 1.0.0
  description: |
    Short-video upload (S3 multipart), metadata and HLS playback URLs.
    Transcoding is asynchronous: complete returns `processing`; the media-worker
    publishes `poro.video.ready` (or `poro.video.failed`) via the outbox.
    Every JSON response uses `{data, error, meta}`; clients branch on `error.code`.
    Access tokens are verified offline against auth JWKS. A token revoked by
    logout stays accepted here until it expires (15 minutes at most).
    Any authenticated PERSONAL account may upload; CREATOR is not required.
    A publication is a video or a photo post (`media_type`, ADR-0020). Photo posts
    are returned only to clients sending `Poro-Capabilities: photo-posts`; without
    it every route behaves as before and never returns a photo post.
servers:
  - url: http://localhost:8083
    description: Local development
tags:
  - name: videos
  - name: platform
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [platform]
      security: []
      summary: Liveness
      responses:
        "200":
          description: Process up
  /health/ready:
    get:
      tags: [platform]
      security: []
      summary: Readiness (Postgres)
      responses:
        "200": { description: Ready }
        "503": { description: Postgres down }
  /api/v1/videos/uploads:
    post:
      tags: [videos]
      summary: Init multipart upload
      description: |
        Creates a video in `uploading` and returns presigned PUT URLs for each
        part (8 MiB). Each URL signs its part's exact length: `part_size` bytes,
        the rest of `size_bytes` for the last part; storage refuses any other
        length with 403. Upload URLs expire after 1 h; an upload left in
        `uploading` for 24 h is aborted and deleted. Max declared size 256 MiB. Title 1–100 runes, description
        0–500 runes. Control and format characters (Unicode Cc, Cf) are refused
        with `title_invalid` / `description_invalid`, except the zero-width
        joiner U+200D between two emoji, so composed emoji are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, content_type, size_bytes]
              properties:
                title: { type: string, maxLength: 100, example: "Match du dimanche" }
                description: { type: string, maxLength: 500 }
                filename: { type: string }
                content_type:
                  type: string
                  enum: [video/mp4, video/quicktime, video/webm]
                size_bytes: { type: integer, minimum: 1, maximum: 268435456 }
      responses:
        "201":
          description: Upload session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/InitUpload" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: "`payload_too_large`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422":
          description: "`title_invalid`, `description_invalid`, `content_type_invalid` or `size_invalid`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/videos/uploads/{id}/complete:
    post:
      tags: [videos]
      summary: Complete multipart upload
      description: |
        Assembles parts, checks magic bytes, sets `processing` and enqueues
        `poro.video.uploaded` in the same transaction.
      parameters:
        - $ref: "#/components/parameters/VideoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [parts]
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [part_number, etag]
                    properties:
                      part_number: { type: integer, minimum: 1 }
                      etag: { type: string }
      responses:
        "200":
          description: Video is processing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Video" }
        "400":
          description: "`upload_incomplete` or `invalid_request`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict` (not uploading)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "413":
          description: "`payload_too_large`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422":
          description: "`invalid_media`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /api/v1/videos/photo-uploads:
    post:
      tags: [videos]
      summary: Create a photo post upload
      description: |
        Creates a photo post in `uploading` with 1 to 10 images and returns one
        presigned PUT URL per image. Each URL signs the image's exact
        `size_bytes` and `content_type`: storage refuses any other body with
        403. URLs expire after 1 h; a post left in `uploading` for 24 h is
        aborted and its sources deleted. The caption (`description`) is
        optional, 0–500 runes, with the same character rules as a video
        description. HEIC/HEIF is refused. Counts against the `init` rate limit.
        Switched off by default: until PHOTO_POSTS_ENABLED, both photo routes
        answer 404 `photo_posts_disabled`.
        Signed storage refuses a body of another length or another
        `Content-Type` with 403 (checked against SeaweedFS). A refused or
        failed PUT can be repeated with the same URL until it expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [images]
              properties:
                description: { type: string, maxLength: 500 }
                images:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [content_type, size_bytes]
                    properties:
                      content_type:
                        type: string
                        enum: [image/jpeg, image/png, image/webp]
                      size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
      responses:
        "201":
          description: Photo upload session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/InitPhotoUpload" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/PhotoPostsDisabled" }
        "413":
          description: "`payload_too_large`: an image declared over 10 MiB (or a JSON body over 64 KiB)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422":
          description: "`image_count_invalid`, `content_type_invalid`, `size_invalid` (size 0 or less) or `description_invalid`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/videos/photo-uploads/{id}/complete:
    post:
      tags: [videos]
      summary: Complete a photo post upload
      description: |
        Checks every image (present, exact declared size, JPEG/PNG/WebP magic
        bytes), sets `processing` and enqueues `poro.video.uploaded`
        (`media_type: photo`) in the same transaction. The media-worker then
        fixes EXIF orientation, re-encodes each image to JPEG (long side at
        most 2048 px, quality 85, no metadata) and publishes `poro.video.ready`;
        one invalid image fails the whole post (`invalid_media`), never a
        partial post. An image not sent yet answers 400 `upload_incomplete` and
        deletes nothing: send it and complete again. A storage failure answers
        500 and deletes nothing either. Called again once processing, it
        answers 409 `conflict`: read the post with GET /api/v1/videos/{id}
        (with the capability) to learn its state. Counts against the
        `complete` rate limit. Until step 2c ships the image processing, a
        completed photo post stays `processing`.
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: Photo post is processing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Video" }
        "400":
          description: "`upload_incomplete` (an image is missing) or `invalid_request`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`not_found` (another account's post, a video, or none), or `photo_posts_disabled`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "409":
          description: "`conflict` (not uploading, including a replayed complete)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "413":
          description: "`payload_too_large`: a stored image is over 10 MiB; the post and its sources are deleted (GET then answers 404)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422":
          description: "`invalid_media`: an image is empty, differs from its declared size, or is not JPEG, PNG or WebP matching its declared type (HEIC included); the post and its sources are deleted (GET then answers 404)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/videos/uploads/{id}:
    delete:
      tags: [videos]
      summary: Abort an in-progress upload
      description: "Aborts a video or a photo post still `uploading`; a photo post's sources are deleted."
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "204": { description: Aborted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`conflict`" }
  /api/v1/videos:
    get:
      tags: [videos]
      summary: List own videos
      description: "Photo posts are listed only with `Poro-Capabilities: photo-posts`."
      parameters:
        - $ref: "#/components/parameters/Capabilities"
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/VideoList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/videos/{id}:
    get:
      tags: [videos]
      security: []
      summary: Get a video
      description: |
        Ready videos are public. Other statuses, and videos removed by moderation, are owner-only
        (404 otherwise). The owner of a removed video gets `moderation_status: removed` and no media URL.
        A photo post is 404 without `Poro-Capabilities: photo-posts`.
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - $ref: "#/components/parameters/Capabilities"
      responses:
        "200":
          description: Video
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Video" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [videos]
      summary: Soft-delete own video
      description: The media leave the public bucket shortly after (quarantine bucket).
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    VideoID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Capabilities:
      name: Poro-Capabilities
      in: header
      required: false
      description: |
        Comma-separated client capabilities, case-insensitive; unknown tokens
        are ignored. `photo-posts`: the client displays photo posts. Without
        it, no photo post is ever returned.
      schema: { type: string, example: photo-posts }
  schemas:
    Envelope:
      type: object
      required: [data, error, meta]
      properties:
        data: {}
        error:
          type: ["object", "null"]
        meta:
          type: object
          properties:
            request_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [data, error, meta]
      properties:
        data: { type: "null" }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        meta:
          type: object
          properties:
            request_id: { type: string }
    InitUpload:
      type: object
      required: [video_id, upload_id, key, part_size, parts]
      properties:
        video_id: { type: string, format: uuid }
        upload_id: { type: string }
        key: { type: string }
        part_size: { type: integer, example: 8388608 }
        parts:
          type: array
          items:
            type: object
            required: [part_number, url]
            properties:
              part_number: { type: integer }
              url: { type: string, format: uri }
    InitPhotoUpload:
      type: object
      required: [video_id, images, expires_in]
      properties:
        video_id: { type: string, format: uuid }
        expires_in: { type: integer, example: 3600, description: Seconds before the URLs expire }
        images:
          type: array
          items:
            type: object
            required: [position, url, headers]
            properties:
              position: { type: integer, minimum: 1, maximum: 10 }
              url: { type: string, format: uri }
              headers:
                type: object
                description: Headers the PUT must send as is (`Content-Type`, `Content-Length`).
                additionalProperties: { type: string }
    Image:
      type: object
      required: [position, url, thumbnail_url, width, height]
      properties:
        position: { type: integer, minimum: 1, maximum: 10 }
        url: { type: string, format: uri, description: JPEG, long side at most 2048 px }
        thumbnail_url: { type: string, format: uri, description: JPEG, long side at most 540 px }
        width: { type: integer }
        height: { type: integer }
    Video:
      type: object
      required: [id, user_id, media_type, title, description, status, moderation_status, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        media_type:
          type: string
          enum: [video, photo]
          description: "`photo`: no `hls_url`, `duration_ms` or `renditions`; `images` holds the pictures in order."
        title: { type: string, description: Empty for a photo post }
        description: { type: string }
        status:
          type: string
          enum: [uploading, processing, ready, failed]
        moderation_status:
          type: string
          enum: [approved, removed]
          description: "`removed`: hidden by moderation; only its owner sees it, without media URLs."
        duration_ms: { type: integer }
        width: { type: integer }
        height: { type: integer }
        hls_url: { type: string, format: uri }
        thumbnail_url: { type: string, format: uri, description: "For a photo post, the thumbnail of image 1" }
        images:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/Image" }
        renditions:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: "360p" }
              bandwidth: { type: integer }
              width: { type: integer }
              height: { type: integer }
        created_at: { type: string, format: date-time }
    VideoList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Video" }
        next_cursor: { type: ["string", "null"] }
  responses:
    InvalidRequest:
      description: "`invalid_request`"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Unauthorized:
      description: "`unauthorized`"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: "`not_found`"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    PhotoPostsDisabled:
      description: "`photo_posts_disabled`: photo posts are switched off on this server (PHOTO_POSTS_ENABLED=false, the default until image processing ships); answered before authentication"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    RateLimited:
      description: "`rate_limited`"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
