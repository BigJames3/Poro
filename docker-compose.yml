# =============================================================
# Poro — Docker Compose (développement local)
# =============================================================
# Ports Windows : Interne Docker
# - Postgres    : 5433 : 5432   (évite cvstudio sur 5432)
# - Redis       : 6380 : 6379   (évite cvstudio sur 6379)
# - SeaweedFS   : 9000 : 8333   (S3 API)
#                 9001 : 9333   (Master UI)
# - Redpanda    : 9092 : 9092   (Kafka)
# - ClickHouse  : 8123 : 8123   (HTTP)
#                 9440 : 9000   (TCP, évite conflit avec SeaweedFS)
# - Qdrant      : 6333 : 6333   (HTTP)
#                 6334 : 6334   (gRPC)
# - Auth        : 8081 : 8081
# =============================================================

services:
  # ─────────────────────────────────────────────
  # BASES DE DONNÉES
  # ─────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: poro-postgres
    environment:
      POSTGRES_USER: poro
      POSTGRES_PASSWORD: poro_dev_password
      POSTGRES_DB: poro_auth
    ports:
      - "5433:5432"
    volumes:
      - poro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poro -d poro_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - poro-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: poro-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - poro_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poro-network
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # STOCKAGE OBJET (S3-compatible, remplace MinIO)
  # ─────────────────────────────────────────────

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: poro-seaweedfs
    command: server -s3 -dir=/data -master.volumeSizeLimitMB=1024
    ports:
      - "9000:8333"   # S3 API
      - "9001:9333"   # Master UI
      - "9002:8888"   # Filer UI
    volumes:
      - poro_seaweedfs_data:/data
    networks:
      - poro-network
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # EVENT STREAMING (Kafka-compatible)
  # ─────────────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: poro-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"   # Kafka API
      - "9644:9644"   # Admin API
      - "8080:8080"   # HTTP Proxy
    volumes:
      - poro_redpanda_data:/var/lib/redpanda/data
    networks:
      - poro-network
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # ANALYTICS (prêt, utilisé plus tard)
  # ─────────────────────────────────────────────

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: poro-clickhouse
    environment:
      CLICKHOUSE_DB: poro_analytics
      CLICKHOUSE_USER: poro
      CLICKHOUSE_PASSWORD: poro_dev_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP
      - "9440:9000"   # TCP (native)
    volumes:
      - poro_clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - poro-network
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # VECTOR DB (recommandation, plus tard)
  # ─────────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant:latest
    container_name: poro-qdrant
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - poro_qdrant_data:/qdrant/storage
    networks:
      - poro-network
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # SERVICE AUTH
  # ─────────────────────────────────────────────

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: poro-auth
    environment:
      APP_ENV: dev
      APP_PORT: "8081"
      LOG_LEVEL: debug

      # Postgres — port INTERNE du conteneur
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: poro
      POSTGRES_PASSWORD: poro_dev_password
      POSTGRES_DB: poro_auth
      POSTGRES_SSLMODE: disable

      # Redis — port INTERNE du conteneur
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"

      # JWT
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 720h

      # OTP
      OTP_TTL: 5m
      OTP_MAX_ATTEMPTS: "3"
      OTP_PROVIDER_URL: ""
      OTP_PROVIDER_KEY: ""
    ports:
      - "8081:8081"
    volumes:
      - ./services/auth/keys:/app/keys:ro
      - ./services/auth/migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - poro-network
    restart: unless-stopped

# =============================================================
# VOLUMES PERSISTANTS
# =============================================================

volumes:
  poro_postgres_data:
  poro_redis_data:
  poro_seaweedfs_data:
  poro_redpanda_data:
  poro_clickhouse_data:
  poro_qdrant_data:

# =============================================================
# RÉSEAU PARTAGÉ
# =============================================================

networks:
  poro-network:
    driver: bridge